<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | Repair Service Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Repair Service Booking</p>
      <h1>Log In</h1>
      <p class="muted">Pre-provisioned accounts only</p>

      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ username|default('') }}" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Log In</button>
      </form>
    </main>
  </body>
</html>
