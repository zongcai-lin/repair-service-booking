<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ area_title }} | Repair Service Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Repair Service Booking</p>
      <h1>{{ area_title }}</h1>
      <p class="muted">Logged in successfully</p>

      {% if success_message %}
        <p class="success" role="status">{{ success_message }}</p>
      {% endif %}

      <dl>
        <div>
          <dt>Signed in as</dt>
          <dd>{{ user['username'] }}</dd>
        </div>
        <div>
          <dt>Role</dt>
          <dd>{{ user['role'] }}</dd>
        </div>
      </dl>

      {% if show_create_booking %}
        <a class="primary-action" href="{{ url_for('create_booking') }}">Create Booking</a>
      {% endif %}

      {% if show_my_bookings %}
        <!-- RSB-7 security is enforced by the route; this link is navigation only. -->
        <a class="secondary-action" href="{{ url_for('my_bookings') }}">My Bookings</a>
      {% endif %}

      <form method="post" action="{{ url_for('logout') }}">
        <button type="submit">Log Out</button>
      </form>
    </main>
  </body>
</html>
